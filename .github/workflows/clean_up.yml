name: Clean Up

on:
  schedule:
    - cron: "20 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 5
          keep_minimum_runs: 3

      - name: Delete Old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          while read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            echo "Delete release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < <(
            gh release list --limit 1000 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName'
          )
